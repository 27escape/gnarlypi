<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gnarly Status</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/static/gnarly_style.css">
    
    <!-- Mobile-First Terminal Layout Overrides -->
    <style>
        /* Force the wrapper to take only the remaining vertical height and strictly prevent scrolling */
        .monitor-wrapper {
            flex-grow: 1;
            padding: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden !important; 
            box-sizing: border-box;
        }

        /* The terminal container expands dynamically but respects the absolute height boundary */
        #status {
            zoom: normal !important; 
            width: 100%;
            height: 100%;
            max-width: 800px;
            
            /* Allow flexbox to distribute height dynamically */
            display: flex;
            flex-direction: column;
            background-color: var(--bg);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 0.5rem;
            box-sizing: border-box;
        }

        /* Each line gets an equal, flexible slice of the available vertical height */
        #status > div {
            flex: 1;
            
            /* 
             * A column flex layout hands vertical centering to 'justify-content',
             * allowing the browser's native text-align (set by JS) to handle horizontal centering.
             */
            display: flex;
            flex-direction: column;
            justify-content: center; 
            
            padding: 0 1rem;
            box-sizing: border-box;
            
            /* vmin perfectly scales typography to the shortest screen edge (crucial for landscape) */
            font-size: clamp(0.7rem, 5vmin, 1.5rem); 
            font-family: 'Courier New', Courier, monospace;
            color: #00ff00;
            
            /* Prevent massive payload strings from wrapping and breaking the flex grid */
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis; 
        }
    </style>
</head>
<body class="page-layout">
    <header class="common-header">
        <div class="common-header-left">
            <a href="/" class="back-btn">&larr; Home</a>
            <span class="header-title">Status</span>
        </div>
    </header>

    <main class="monitor-wrapper">
        <div id="status">
            <div id="line0" style="background-color: var(--bg);">&nbsp;</div>
            <div id="line1" style="background-color: var(--bg);">&nbsp;</div>
            <div id="line2" style="background-color: var(--bg);">&nbsp;</div>
            <div id="line3" style="background-color: var(--bg);">&nbsp;</div>
            <div id="line4" style="background-color: var(--bg);">&nbsp;</div>
            <div id="line5" style="background-color: var(--bg);">&nbsp;</div>
            <div id="line6" style="background-color: var(--bg);">&nbsp;</div>
            <div id="line7" style="background-color: var(--bg);">&nbsp;</div>
        </div>
    </main>

    <script src="/static/gnarly_status.js"></script>
    <script>
        const eventSource = new EventSource('/stream');

        eventSource.onmessage = function(event) {
            try {
                const data = JSON.parse(event.data);
                const message = data.message;
                const topic = message.topic || "Unknown Topic";
                const payload = message.payload;

                if (topic !== "Unknown Topic" && payload !== null && payload !== undefined) {
                    handle_msg(topic, payload);
                }
            } catch (e) {
                console.error("Error parsing message:", e, event.data);
            }
        };
    </script>
</body>
</html>
