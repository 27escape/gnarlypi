<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gnarly Status</title>
    <link rel="stylesheet" href="/static/gnarly_style.css">
</head>
<body class="page-layout">
    <header class="common-header">
        <div class="common-header-left">
            <a href="/" class="back-btn">&larr; Home</a>
            <span class="header-title">Status</span>
        </div>
    </header>

    <main class="monitor-wrapper">
        <div id="status">
            <div id="line0" style="background-color: var(--bg);">&nbsp;</div>
            <div id="line1" style="background-color: var(--bg);">&nbsp;</div>
            <div id="line2" style="background-color: var(--bg);">&nbsp;</div>
            <div id="line3" style="background-color: var(--bg);">&nbsp;</div>
            <div id="line4" style="background-color: var(--bg);">&nbsp;</div>
            <div id="line5" style="background-color: var(--bg);">&nbsp;</div>
            <div id="line6" style="background-color: var(--bg);">&nbsp;</div>
            <div id="line7" style="background-color: var(--bg);">&nbsp;</div>
        </div>
    </main>

    <script src="/static/gnarly_status.js"></script>
    <script>
        const eventSource = new EventSource('/stream');

        eventSource.onmessage = function(event) {
            try {
                const data = JSON.parse(event.data);
                const message = data.message;
                const topic = message.topic || "Unknown Topic";
                const payload = message.payload;

                if (topic !== "Unknown Topic" && payload !== null && payload !== undefined) {
                    handle_msg(topic, payload);
                }
            } catch (e) {
                console.error("Error parsing message:", e, event.data);
            }
        };
    </script>
</body>
</html>
