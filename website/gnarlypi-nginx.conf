server {
    # Listen on standard HTTP port 80
    listen 80;
    listen [::]:80;
    
    # Catch-all server name, responds to the Pi's IP address or local hostname
    server_name _; 
    
    # ------------------------------------------------------------------------
    # Failsafe Fallback Route
    # A named location to route blocked requests back to your Python backend
    # ------------------------------------------------------------------------
    location @flask_fallback {
        proxy_pass http://127.0.0.1:8027;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------------------
    # 1. High-Performance Static Asset Serving
    # ------------------------------------------------------------------------
    location /static/ {
        # Using 'root' maps the request /static/ to /home/kevinmu/gnarlypi/website/static/
        root /home/kevinmu/gnarlypi/website;
        expires 30d;
        access_log off;
        
        # If www-data lacks permissions (403) or file is missing (404), route to Python
        error_page 403 404 = @flask_fallback;
    }

    # ------------------------------------------------------------------------
    # 2. Direct USB Media Serving
    # ------------------------------------------------------------------------
    location /media/ {
        alias /home/kevinmu/usb_data/;
        expires 30d;
        access_log off;
        mp4;
        
        # If www-data lacks USB mount permissions (403) or missing (404), route to Python
        error_page 403 404 = @flask_fallback;
    }

    # ------------------------------------------------------------------------
    # 3. SSE (Server-Sent Events) Stream Protection (Gold Feature)
    # ------------------------------------------------------------------------
    location /stream {
        proxy_pass http://127.0.0.1:8027/stream;
        
        # Critical headers to prevent Nginx from buffering the infinite stream
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        
        # Prevent Nginx from timing out the persistent connection
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ------------------------------------------------------------------------
    # 4. Default Application Reverse Proxy
    # Routes all standard web traffic to your Python Flask application.
    # ------------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:8027;
        
        # Forward original client IP and host details to Flask
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}